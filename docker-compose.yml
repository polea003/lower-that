services:
  server:
    profiles: ["express"]
    build:
      context: ./server
    container_name: lower-that-server
    environment:
      # Required
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Optional, defaults to false here to avoid requiring TV envs
      TV_CONTROL_ENABLED: ${TV_CONTROL_ENABLED:-false}
      SAMSUNG_TV_IP_ADDRESS: ${SAMSUNG_TV_IP_ADDRESS:-}
      SAMSUNG_TV_MAC_ADDRESS: ${SAMSUNG_TV_MAC_ADDRESS:-}
      PORT: 3000
    networks:
      default:
        aliases:
          - backend

  fastapi-server:
    profiles: ["fastapi"]
    build:
      context: ./fastapi-server
    container_name: lower-that-fastapi-server
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TV_CONTROL_ENABLED: ${TV_CONTROL_ENABLED:-false}
      SAMSUNG_TV_IP_ADDRESS: ${SAMSUNG_TV_IP_ADDRESS:-}
      SAMSUNG_TV_MAC_ADDRESS: ${SAMSUNG_TV_MAC_ADDRESS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
    networks:
      default:
        aliases:
          - backend

  web:
    build:
      context: ./web
    container_name: lower-that-web
    environment:
      # The active backend service binds this shared alias.
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - '5173:5173'
